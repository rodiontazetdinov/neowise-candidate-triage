<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    [data-status="manual_review"] { padding: .5rem .75rem; border-left: 4px solid #c2410c; background: #fff7ed; }
    [data-status="empty"] { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" required></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик ответа:</strong></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    import { createTriageController, renderInto } from "/app.mjs";

    const elements = {
      message: document.querySelector("#status"),
      topic: document.querySelector("#topic"),
      draft: document.querySelector("#draft"),
      result: document.querySelector("#result"),
    };
    const controller = createTriageController({ render: (state) => renderInto(elements, state) });

    const form = document.querySelector("form");
    form.noValidate = true; // пустой ввод показываем своим сообщением
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      controller.submit(document.querySelector("#message").value);
    });
  </script>
</body>
</html>
